spring.application.name=annara-api
server.port=${PORT:8080}

# MongoDB Configuration (supports MongoDB Atlas or local MongoDB)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/annara}
spring.data.mongodb.database=${MONGODB_DATABASE:annara}
spring.data.mongodb.auto-index-creation=true

# Uploads Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=${UPLOAD_DIR:uploads}

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-before-deployment-0123456789}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:12}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
