services:
  mongodb:
    image: mongo:8.0
    container_name: annara-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - annara_mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: annara
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  annara_mongo_data:
